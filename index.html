<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mei Lee · Flashcards del speech</title>
<style>
:root{
  --bg:#2a0f1f; --front:#4a1a33; --front-ink:#fbeaf0; --muted:#d9a7bd;
  --jade:#ff9ec4; --back:#fbeef2; --back-ink:#4a1229; --lacquer:#b01e5a;
  box-sizing:border-box; color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--front-ink);
  font-family:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:18px 14px 28px}
.dragon{position:fixed;inset:0;z-index:0;pointer-events:none;color:#ff9ec4;opacity:.05;overflow:hidden;display:flex;align-items:center;justify-content:center}
.dragon svg{width:100%;height:100%}
h1,.sub,.dots,.nav,.viewport{position:relative;z-index:1}
.face>:first-child{margin-top:auto}
.audio{display:flex;flex-direction:column;align-items:center;gap:14px;margin:6px 0}
.audio button{background:#6b2a4a;color:var(--front-ink);border:0;border-radius:999px;padding:11px 20px;font:inherit;font-size:.95rem;cursor:pointer}
.audio .big{background:var(--jade);color:#4a1229;font-weight:700;font-size:1.1rem;padding:16px 32px}
.arow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.arow label{font-size:.9rem;color:var(--muted)}
.arow select{background:#6b2a4a;color:var(--front-ink);border:0;border-radius:999px;padding:9px 12px;font:inherit;font-size:.9rem;margin-left:6px}
.audio.mini{flex-direction:row;justify-content:center;gap:10px;margin:12px 0 4px}
.audio.mini button{padding:10px 18px}
.gif{width:min(75%,250px);height:auto;margin:auto;border-radius:16px}
.astatus{margin:0;font-size:.9rem;color:var(--jade);min-height:1.2em}
h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.35rem;margin:0 0 2px;text-align:center}
.sub{color:var(--muted);font-size:.85rem;margin:0 0 14px;text-align:center}
.dots{display:flex;gap:8px;margin-bottom:14px}
.dot{width:9px;height:9px;border-radius:50%;background:#6b2a4a;border:0;padding:0;cursor:pointer}
.dot.on{background:var(--jade);transform:scale(1.35)}
.viewport{width:100%;max-width:460px;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.track{display:flex;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.track.drag{transition:none}
.slot{flex:0 0 100%;padding:4px;perspective:1200px}
.card{position:relative;height:clamp(380px,62vh,520px);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:22px 22px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;overflow-y:auto}
.front{background:var(--front);border:1.5px solid #7a3257}
.back{background:var(--back);color:var(--back-ink);transform:rotateY(180deg)}
.tag{font-weight:700;color:var(--jade);font-size:.95rem;margin:0 0 6px}
.back .tag{color:var(--lacquer)}
h2{font-family:"Fraunces",Georgia,serif;font-size:1.7rem;line-height:1.15;margin:0 0 12px;font-weight:600}
.idea{font-size:1.02rem;line-height:1.45;margin:0 0 14px}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 12px;padding:0;list-style:none}
.keys li{background:#6b2a4a;border-radius:999px;padding:7px 13px;font-size:.95rem}
.keys li.arrow{background:none;padding:7px 0;color:var(--jade)}
table{border-collapse:collapse;width:100%;font-size:.95rem;margin-top:4px}
td{text-align:center;padding:7px 4px;border-top:1px solid #7a3257;vertical-align:top}
td:first-child{color:var(--muted);width:42%}
td:last-child{font-weight:600;color:var(--jade)}
.hint{margin-top:auto;padding-top:12px;font-size:.8rem;color:var(--muted)}
.back .hint{color:#9a6a80}
.back p{font-size:1.08rem;line-height:1.6;margin:0 0 10px;font-family:"Fraunces",Georgia,serif}
.back ul,.back ol{text-align:left;margin:0 0 8px;padding-left:20px;font-size:.98rem;line-height:1.5}
.back li{margin-bottom:6px}
.nav{display:flex;gap:12px;margin-top:16px;align-items:center}
.nav button{background:#6b2a4a;color:var(--front-ink);border:0;border-radius:999px;padding:11px 20px;font:inherit;font-size:.95rem;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav span{color:var(--muted);font-size:.9rem;min-width:48px;text-align:center}
button:focus-visible{outline:2px solid var(--jade);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.card,.track{transition:none}}
</style>
</head>

<h1>Mei Lee</h1>
<p class="sub">Toca la tarjeta para voltearla · desliza para cambiar de bloque</p>

<script>
const CARDS=[
{n:"Bloque 1",t:"Subir",idea:"El viaje empieza al subir y la noche cambia.",
 keys:["Chapultepec","noveno piso","ciudad distinta","Mei Lee"],arrows:true,
 tip:"Gesto: sube la mano al decir “subir”.",
 back:["Cuentan que hay lugares donde la noche cambia al cruzar una puerta. En Lady Lee, el viaje empieza al subir: dejamos abajo el movimiento de Chapultepec y llegamos al noveno piso, donde la ciudad se ve distinta y la noche parece abrirse un poco más. De esa sensación nace Mei Lee."]},
{n:"Bloque 2",t:"El encuentro",idea:"Dos identidades en una sola bebida, sin que una borre a la otra.",
 keys:["Lady Lee = oriental","Dobel = tradición mexicana","ninguna borra a la otra"],
 tip:"Gesto: una mano por identidad; júntalas en “encontrarse”.",
 back:["Imaginamos el cóctel como un pequeño encuentro entre dos identidades. Por un lado está Lady Lee, con su atmósfera de inspiración oriental; por otro, Maestro Dobel, con la tradición tequilera mexicana que lo acompaña. No queríamos que una identidad borrara a la otra. Queríamos que pudieran encontrarse en una misma bebida."]},
{n:"Bloque 3",t:"Ingredientes",idea:"Cada ingrediente tiene un rol. Es el bloque más importante.",
 keys:["Diamante","sake","jarabe jazmín-coco","hierbabuena","mineral"],
 table:[["Jazmín","aroma"],["Coco","envolvente"],["Hierbabuena + mineral","fresco y ligero"],["Sake","redondea, sin quitar protagonismo al tequila"]],
 tip:"Cuenta con los dedos: 1 Diamante, 2 sake, 3 jarabe, 4 hierbabuena, 5 mineral.",
 back:["Para construir ese puente, elegimos Maestro Dobel Diamante y sake, acompañados por un jarabe casero donde se encuentran el jazmín y el coco. La hierbabuena y el agua mineral completan la propuesta. El jazmín guía la parte aromática; el coco aporta una nota envolvente, mientras que la hierbabuena y el agua mineral llevan la mezcla hacia una sensación más fresca y ligera.","Usamos sake porque aporta una nota delicada y redondea la mezcla. Nos ayuda a unir el carácter de Maestro Dobel con el aroma floral del jazmín y el coco, sin quitarle protagonismo al tequila."]},
{n:"Bloque 4",t:"Batch y boba",idea:"Consistencia en el servicio y presentación juguetona.",
 keys:["batch","listo para servir","vaso boba","curiosidad"],arrows:true,
 tip:"Piensa: primero el orden, luego el gesto sorpresa.",
 back:["La preparación se organiza en batch: dejamos la mezcla lista para que, al momento del servicio, pueda servirse directamente en el vaso tipo boba. Esta técnica permite que la experiencia sea consistente y que la atención esté en el encuentro de los ingredientes. La presentación añade un gesto inesperado; despierta curiosidad y le da a Mei Lee un carácter juguetón."]},
{n:"Bloque 5",t:"Cierre",idea:"Tradición e imaginación: una pausa en lo alto de la ciudad.",
 keys:["Dobel = herencia","Lady Lee = escenario","pausa en lo alto","familiar + inesperado"],
 tip:"Memoriza bien la última frase: es tu cierre.",
 back:["La intención es que el cóctel cuente una historia de tradición e imaginación. Maestro Dobel trae la herencia tequilera mexicana; Lady Lee nos ofrece el escenario para llevarla a un universo distinto. Mei Lee reúne ambas identidades en una bebida fresca y aromática, con una presentación que invita a descubrirla. Es una pequeña pausa en lo alto de la ciudad: un encuentro entre lo familiar y lo inesperado."]},
{n:"Audio",t:"Escucha el speech",idea:"El speech completo en voz alta, de principio a fin.",audio:true,
 tip:"Úsalo al caminar o antes de dormir.",back:[]},
{n:"Extra",t:"Cómo memorizarlo",idea:"Estrategias para fijar el speech.",extra:true,
 list:["Aprende primero el orden de los 5 bloques","Usa palabras ancla, no frases exactas","Repite por capas: 1, luego 1+2, luego 1+2+3…","Gestos con las manos en cada bloque","Grábate y escúchate al caminar","Repasa antes de dormir y al despertar"],
 tip:"Voltea para ver tu plan de hoy.",
 backHtml:`<p class="tag">Plan para hoy</p>
 <ol><li><b>Ahora:</b> escribe a mano las palabras clave de cada bloque.</li>
 <li><b>Después:</b> practica un bloque a la vez, 3 veces cada uno, sin mirar.</li>
 <li><b>Luego:</b> une los bloques de 2 en 2 y al final los 5 juntos.</li>
 <li><b>Antes de dormir:</b> una pasada completa. <b>Al despertar:</b> otra.</li></ol>
 <p style="font-size:.98rem">Si te trabas mañana, no te detengas: usa tus palabras ancla y sigue. El jurado valora la naturalidad más que la fidelidad exacta.</p>`},

function audioUI(){return `<div class="audio"><button id="aplay" class="big">▶ Reproducir</button><div class="arow"><button id="astop">Detener</button><label>Velocidad<select id="arate"><option value="0.8">Lenta</option><option value="0.92" selected>Normal</option><option value="1.05">Rápida</option></select></label></div><p id="astatus" class="astatus"></p></div>`}
const $=id=>document.getElementById(id);
(function(){const p=[],n=14;for(let i=0;i<n*2;i++){const r=i%2?29:37,a=Math.PI*i/n-Math.PI/2;p.push((42+r*Math.cos(a)).toFixed(1)+","+(42+r*Math.sin(a)).toFixed(1))}
  document.getElementById("logo").innerHTML=`<polygon points="${p.join(" ")}" fill="currentColor"/>`})();
const track=$("track"),vp=$("vp"),dots=$("dots");
let idx=0;
CARDS.forEach((c,i)=>{
  let front=`<p class="tag">${c.n}</p><h2>${c.t}</h2><p class="idea">${c.idea}</p>`;
  if(c.audio) front+=audioUI();
  else if(c.extra) front+=`<ul style="margin:0;padding:0;list-style:none;line-height:1.7">${c.list.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  else{
    front+=`<ul class="keys">${c.keys.map((k,j)=>(c.arrows&&j?`<li class="arrow">→</li>`:"")+`<li>${k}</li>`).join("")}</ul>`;
    if(c.table) front+=`<table>${c.table.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table>`;
  }
  front+=`<p class="hint">${c.gif?"":c.tip+" Toca para ver el texto."}</p>`;
  const bAud=(c.back&&!c.audio&&!c.backHtml)?`<div class="audio mini" data-i="${i}"><button class="bplay">▶ Escuchar</button><button class="brep">Repetir</button></div>`:"";
  const back=c.backHtml||`<p class="tag">${c.n} · ${c.t}</p>`+c.back.map(p=>`<p>${p}</p>`).join("");
  const s=document.createElement("div");s.className="slot";
  s.innerHTML=`<div class="card"><div class="face front">${front}</div><div class="face back">${back}${bAud}${c.gif?"":`<p class="hint">Toca para volver.</p>`}</div></div>`;
  track.appendChild(s);
  const d=document.createElement("button");d.className="dot";d.setAttribute("aria-label",c.n+": "+c.t);
  d.onclick=()=>go(i);dots.appendChild(d);
});
const cards=[...document.querySelectorAll(".card")];
const synth=window.speechSynthesis;
let speaking=false,paused=false,voice=null,token=0;
function pickVoice(){const vs=synth.getVoices();voice=vs.find(v=>v.lang.replace("_","-")==="es-MX")||vs.find(v=>v.lang.toLowerCase().startsWith("es"))||null}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
const ap=$("aplay"),as=$("astop"),ast=$("astatus"),ar=$("arate");
function setUI(){ap.textContent=!speaking?"▶ Reproducir":paused?"▶ Continuar":"❚❚ Pausar"}
function done(){speaking=false;paused=false;setUI();ast.textContent=""}
ap.onclick=()=>{
  if(!synth){ast.textContent="Tu navegador no soporta audio de voz.";return}
  if(speaking&&!paused){synth.pause();paused=true;setUI();ast.textContent="En pausa";return}
  if(speaking&&paused){synth.resume();paused=false;setUI();ast.textContent="Reproduciendo…";return}
  bDone();synth.cancel();token++;const t=token;speaking=true;paused=false;setUI();ast.textContent="Reproduciendo…";
  FULLTEXT.forEach((txt,i)=>{
    const u=new SpeechSynthesisUtterance(txt);u.lang="es-MX";if(voice)u.voice=voice;u.rate=parseFloat(ar.value);
    u.onend=()=>{if(t===token&&i===FULLTEXT.length-1)done()};
    u.onerror=()=>{if(t===token)done()};
    synth.speak(u);
  });
};
as.onclick=()=>{if(!synth)return;token++;synth.cancel();done()};
let bI=-1,bSp=false,bPa=false;
function bUpd(){document.querySelectorAll(".audio.mini").forEach(g=>{const on=+g.dataset.i===bI&&bSp;g.querySelector(".bplay").textContent=!on?"▶ Escuchar":bPa?"▶ Continuar":"❚❚ Pausar"})}
function bDone(){bSp=false;bPa=false;bI=-1;bUpd()}
function bStart(i){
  token++;const t=token;synth.cancel();done();
  bI=i;bSp=true;bPa=false;bUpd();
  const list=CARDS[i].back;
  list.forEach((txt,k)=>{
    const u=new SpeechSynthesisUtterance(txt);u.lang="es-MX";if(voice)u.voice=voice;u.rate=parseFloat(ar.value);
    u.onend=()=>{if(t===token&&k===list.length-1)bDone()};
    u.onerror=()=>{if(t===token)bDone()};
    synth.speak(u);
  });
}
track.addEventListener("click",e=>{
  const b=e.target.closest(".bplay,.brep");if(!b||!synth)return;
  const i=+b.closest(".audio.mini").dataset.i;
  if(b.classList.contains("brep")){bStart(i);return}
  if(bI===i&&bSp){if(bPa){synth.resume();bPa=false}else{synth.pause();bPa=true}bUpd()}
  else bStart(i);
});
function go(i){
  idx=Math.max(0,Math.min(CARDS.length-1,i));
  if(bSp&&bI!==idx){token++;if(synth)synth.cancel();bDone()}
  track.style.transform=`translateX(${-idx*100}%)`;
  cards.forEach((c,j)=>{if(j!==idx)c.classList.remove("flip")});
  [...dots.children].forEach((d,j)=>d.classList.toggle("on",j===idx));
  $("count").textContent=(idx+1)+" / "+CARDS.length;
  $("prev").disabled=idx===0;$("next").disabled=idx===CARDS.length-1;
}
$("prev").onclick=()=>go(idx-1);$("next").onclick=()=>go(idx+1);
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")go(idx+1);
  else if(e.key==="ArrowLeft")go(idx-1);
  else if(e.key===" "||e.key==="Enter"){if(document.activeElement.tagName!=="BUTTON"){e.preventDefault();cards[idx].classList.toggle("flip")}}
});
let sx=0,dx=0,down=false,moved=false;
vp.addEventListener("pointerdown",e=>{if(e.target.closest("button,select,label")){down=false;return}down=true;moved=false;sx=e.clientX;dx=0;});
vp.addEventListener("pointermove",e=>{
  if(!down)return;dx=e.clientX-sx;
  if(Math.abs(dx)>8){moved=true;track.classList.add("drag");
    track.style.transform=`translateX(calc(${-idx*100}% + ${dx}px))`;}
});
function end(){
  if(!down)return;down=false;track.classList.remove("drag");
  if(moved&&Math.abs(dx)>60)go(idx+(dx<0?1:-1));
  else if(moved)go(idx);
  else cards[idx].classList.toggle("flip");
}
vp.addEventListener("pointerup",end);
vp.addEventListener("pointercancel",()=>{down=false;track.classList.remove("drag");go(idx)});
go(0);
</script>
</body>
</html>
